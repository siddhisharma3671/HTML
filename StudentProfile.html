<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f3;
        }

        .profile {
            width: 350px;
            margin: 80px auto;
            background: white;
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #4a90e2;
            object-fit: cover;
        }

        h1 {
            margin: 15px 0 5px;
            color: #222;
        }

        h3 {
            color: #4a90e2;
            margin-top: 5px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .skills {
            margin-top: 20px;
        }

        .skills span {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
        }

        .contact {
            margin-top: 20px;
        }

        .contact a {
            text-decoration: none;
            color: white;
            background: #4a90e2;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .contact a:hover {
            background: #256bb0;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="https://via.placeholder.com/120" alt="Student Photo">

        <h1>Siddhi Sharma</h1>

        <h3>Computer Science Student</h3>

        <p>
            Hello! I am a CSE student interested in programming,
            web development and building creative projects.
        </p>

        <div class="skills">
            <span>Java</span>
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>React</span>
        </div>

        <div class="contact">
            <a href="mailto:example@gmail.com">Contact Me</a>
        </div>

    </div>

</body>
</html>
